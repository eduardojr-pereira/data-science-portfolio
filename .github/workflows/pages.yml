# Responsibility: Build and optionally deploy the authorized portfolio with the canonical EP builder.
# Boundaries: No legacy renderers, mutable EP branch reference, or automatic deployment.
name: Publish canonical portfolio

on:
  workflow_dispatch:
    inputs:
      ep_commit:
        description: Full 40-character SHA of the approved EP Brand commit
        required: true
        type: string
      publish:
        description: Deploy only after release and third-party rights approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Validate release inputs
        env:
          EP_COMMIT: ${{ inputs.ep_commit }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi

      - name: Check out portfolio
        uses: actions/checkout@v6
        with:
          path: portfolio
          persist-credentials: false

      - name: Check out canonical EP Brand
        uses: actions/checkout@v6
        with:
          repository: eduardojr-pereira/ep-brand-assets
          ref: ${{ inputs.ep_commit }}
          path: ep-brand-assets
          persist-credentials: false

      - name: Verify EP Brand revision
        env:
          EP_COMMIT: ${{ inputs.ep_commit }}
        run: test "$(git -C ep-brand-assets rev-parse HEAD)" = "$EP_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.4'

      - name: Install canonical build dependencies
        run: |
          python -m pip install -r ep-brand-assets/requirements.txt
          python -m pip check

      - name: Build complete site
        run: |
          python -B ep-brand-assets/tools/builder.py \
            --source "$GITHUB_WORKSPACE/portfolio" \
            --plan "$GITHUB_WORKSPACE/portfolio/config/site-plan.json" \
            --output "$RUNNER_TEMP/portfolio-pages" \
            --complete-site

      - name: Configure GitHub Pages
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/portfolio-pages

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
